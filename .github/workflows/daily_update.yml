name: 日频数据更新

on:
  # 每个交易日（周一到周五）15:30 CST = 07:30 UTC 执行
  schedule:
    - cron: '30 7 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pandas numpy requests

      - name: 检查是否为A股交易日
        id: check_trading_day
        run: |
          python3 -c "
          import datetime
          import urllib.request
          import json
          today = datetime.date.today()
          # 简单判断：周末不执行
          if today.weekday() >= 5:
              print('Weekend, skipping.')
              import sys; sys.exit(1)
          print(f'Today is {today}, weekday={today.weekday()}, proceeding.')
          "

      - name: 运行日频更新
        run: |
          cd scripts
          python3 update_daily.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📊 日频数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 触发GitHub Pages部署
        if: success()
        run: |
          echo "Pages will be automatically deployed via GitHub Pages settings."
